  :root{
    --accent: #E1522C;
    --accent-dark: #b5401f;
    --cream: #F4F3EC;
    --white: #FFFFFF;
    --gray-200: #E8E8E8;
    --gray-600: #737373;
    --promo-rest: #000000;

    /* the progress tint, straight from the design */
    --prog-rgb: 183, 229, 185;
    --done-green: #21A663;   /* completion: the check disc AND the text crest */

    --t-scale: 1.1;
    --expand-dur: .55s;
    --expand-ease: cubic-bezier(.25,.8,.3,1);
    /* easeInSine — the standard bezier for it. Starts almost still and keeps
       gaining speed, so the fill leans into the move rather than braking at
       the end the way the ease-out did. */
    --ease-in-sine: cubic-bezier(.12, 0, .39, 0);
  }

  button{ font-family:inherit; }

    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    background:#000000;
    font-family:'IRANYekanXVFaNum', Tahoma, sans-serif;
    font-variation-settings:'dots' 0;
    padding-bottom: 40px;
  }

  .stage{ position:relative; width:390px; max-width:92vw; }

  /* the burst sits BEHIND the component (.fab is z-index 1) */
  .spark{
    position:absolute; left:50%; top:50%;
    width:560px; height:560px;
    transform:translate(-50%,-50%);
    z-index:0; pointer-events:none;
    opacity:0; transition:opacity .25s ease;
  }
  .spark.on{ opacity:1; }
  .spark svg{ display:block; }

  /* ================= card ================= */
  .fab{
    position:relative;
    z-index:1;
    padding:0; margin:0;
    transition:
      padding var(--expand-dur) var(--expand-ease),
      margin  var(--expand-dur) var(--expand-ease);
  }

  /* The card surface. On a pseudo-element so it can be inset 1px INSIDE the
     pill while closed — the card is never faded, it is opaque at all times and
     simply hides behind the pill, then grows out from under it. Exact
     coincidence is not enough: along the pill's corner arcs the antialiased
     edge is only partly opaque and a coincident card bleeds a warm fringe
     through it. Padding only pushes outward, so the inset needs a positioned
     layer. */
  .fab::before{
    content:'';
    position:absolute;
    top:1px; right:1px; bottom:1px; left:1px;
    z-index:-1;
    background: var(--cream);
    border-radius:36px;
    box-shadow: 0 8px 20px rgba(0,0,0,0);
    transition:
      top var(--expand-dur) var(--expand-ease),
      right var(--expand-dur) var(--expand-ease),
      bottom var(--expand-dur) var(--expand-ease),
      left var(--expand-dur) var(--expand-ease),
      box-shadow var(--expand-dur) var(--expand-ease);
  }
  .fab.open::before{ top:0; right:0; bottom:0; left:0; box-shadow: 0 8px 20px rgba(0,0,0,.10); }

  /* padding grows the card outward; the equal negative margin cancels its
     effect on layout so the pill never moves or resizes */
  .fab.open{ padding:12px 6px 6px; margin:-12px -6px -6px; }          /* promo   */
  .fab.open.prog{ padding:8px 4px 4px;  margin:-8px -4px -4px; }      /* running */
  .fab.open.done{ padding:12px 4px 4px; margin:-12px -4px -4px; }     /* complete: 8px taller */

  /* ---------------- progress fill ----------------
     A plain horizontal gradient, right-anchored — no wavy edge.
     The tint is strongest at the band's LEFT and fades out toward the card's
     right edge. That direction matters: running it the other way puts full
     opacity against the right edge and paints over the card's rounded border
     there. Fading out at the right keeps that border visible. */
  .fill{
    position:absolute; inset:0; z-index:-1;
    border-radius:36px;
    overflow:hidden;
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
  }
  .fab.prog .fill, .fab.done .fill{ opacity:1; }
  .fill i{
    position:absolute; top:0; right:0; bottom:0;
    display:block;
    width: var(--fill-w, 0%);
    background: linear-gradient(90deg,
      rgba(var(--prog-rgb), .8)  0%,
      rgba(var(--prog-rgb), .4) 25%,
      rgba(var(--prog-rgb), 0) 100%);
    transition: width .583s var(--ease-in-sine);   /* .7s / 1.2 = 20% quicker */
  }

  /* ---------------- top row ---------------- */
  .card-row{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    padding:0 24px;
    height:0;
    opacity:0;
    overflow:hidden;
    transform:translateY(-6px);
    transition:
      height        var(--expand-dur) var(--expand-ease),
      margin-bottom var(--expand-dur) var(--expand-ease),
      opacity       .34s ease,
      transform     .34s ease;
  }
  .fab.open .card-row{
    height:24px;
    opacity:1;
    overflow:visible;      /* sparkles overflow the card */
    transform:translateY(0);
    margin-bottom:12px;
  }
  .fab.open.prog .card-row{ margin-bottom:8px; }
  .fab.open.done .card-row{ margin-bottom:12px; }

  .row{ display:none; align-items:center; gap:8px; }
  .row.active{ display:flex; }

  /* plain running message */
  /* running + completion rows share one weight (600 = the design's Medium) */
  .prog-text{ margin:0; font-size:12px; line-height:20px; font-weight:600; color:#000; white-space:nowrap; }
  .prog-text b{ font-weight:inherit; }
  /* dimensions come from each icon's own attributes so every glyph keeps its
     true aspect ratio */
  .prog-icon{ flex:none; display:block; }

  /* ---------------- wave text (promo + completion) ---------------- */
  .wave-text{
    position:relative;
    margin:0;
    font-size:12px;
    line-height:20px;
    font-weight:600;
    color: var(--promo-rest);
    white-space:nowrap;
    letter-spacing:-.1px;
  }
  /* the intact, correctly-shaped run: keeps the sentence as real selectable
     text and provides the box the absolute glyphs are measured against */
  .wave-text .src{ color:transparent; }
  .wave-text .glyphs{ position:absolute; inset:0; pointer-events:none; }
  .wave-text .ch{
    position:absolute;
    display:inline-block;
    transform-origin:50% var(--ch-origin-y, 78%);
    will-change:transform, color;
    color: var(--promo-rest);
  }

  /* ===== per-LETTER travelling wave, measured frame-by-frame off the Airbnb
     "Rare find!" capture (60fps):
       - the crest is per-LETTER, not per-word
       - word x-positions never move -> transform:scale, NOT font-size
         (font-size would reflow the line every frame)
       - cap-height 8 -> 9.5 CSS px at the peak -> scale 1.19
       - the BASELINE rises 1px while the TOP rises 2.5px: scale about the
         baseline PLUS a 1px lift
       - after falling back it UNDERSHOOTS to ~0.94 before settling
       - colour is a DIFFERENT curve from size: snaps on faster, and is gone
         before the undershoot happens
       - the crest advances at a constant SPATIAL speed (~1.82ms/CSS px), not a
         constant per-letter step, so wide letters hold it longer. That is what
         makes it read as a wave rather than a chase of equal blinks. */
  .fab.wave-on .wave-text .ch{
    animation:
      ch-lift var(--ch-dur) linear var(--ch-delay) both,
      ch-tint var(--ch-dur) linear var(--ch-delay) both;
  }
  @keyframes ch-lift{
    0%  { transform: translateY(0) scale(1);
          animation-timing-function: cubic-bezier(.17,.85,.3,1); }
    14% { transform: translateY(-1px) scale(1.19);
          animation-timing-function: linear; }
    44% { transform: translateY(-1px) scale(1.19);
          animation-timing-function: cubic-bezier(.45,0,.55,1); }
    64% { transform: translateY(0) scale(1);
          animation-timing-function: cubic-bezier(.4,0,.6,1); }
    80% { transform: translateY(.5px) scale(.94);
          animation-timing-function: cubic-bezier(.3,0,.4,1); }
    100%{ transform: translateY(0) scale(1); }
  }
  /* Narrower window than the swell, and a different shape. Width matters: at
     ~1.82ms/px a 145ms window puts about two words under colour at once while
     the 307ms size window spans ~60% of the sentence. That mismatch is what
     stops it reading as a plain highlight. */
  @keyframes ch-tint{
    0%  { color: var(--promo-rest);
          animation-timing-function: cubic-bezier(.05,.9,.15,1); }
    6%  { color: color-mix(in srgb, var(--wave-accent) 70%, var(--promo-rest));
          animation-timing-function: cubic-bezier(.3,.6,.4,1); }
    14% { color: var(--wave-accent); animation-timing-function: linear; }
    26% { color: var(--wave-accent);
          animation-timing-function: cubic-bezier(.5,0,.7,.4); }
    34% { color: color-mix(in srgb, var(--wave-accent) 55%, var(--promo-rest));
          animation-timing-function: cubic-bezier(.4,0,.6,1); }
    44% { color: var(--promo-rest); }
    100%{ color: var(--promo-rest); }
  }
  .wave-text{ --wave-accent: var(--accent); }
  /* On completion the crest picks up the success green instead of the brand
     orange, reusing the very same token as the check disc so the two can never
     drift apart. */
  .fab.done .wave-text{ --wave-accent: var(--done-green); }

  @media (prefers-reduced-motion: reduce){
    .fab.wave-on .wave-text .ch{ animation:none; }
  }

  /* ---------------- tag + sparkle burst (promo only) ---------------- */
  .tag-wrap{ position:relative; flex:none; width:22.5px; height:22.5px; }
  .tag-wrap.hide{ display:none; }
  .tag-badge{ width:100%; height:100%; transform:scale(0); }
  .fab.promo-on .tag-badge{
    animation: badge-pop calc(.5s * var(--t-scale)) cubic-bezier(.3,1.4,.4,1) calc(.35s * var(--t-scale)) forwards;
  }
  @keyframes badge-pop{ 0%{transform:scale(0)} 65%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .tag-badge svg{ display:block; width:100%; height:100%; }

  .sparkles{ position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none; }
  /* Every sparkle is parked AT THE ORIGIN, not at its destination — the scatter
     is produced by the animation. Positioning them at their final offsets and
     fading them up read as "a static scatter appearing" rather than a burst. */
  .sparkles i{
    position:absolute; left:0; top:0; display:block; opacity:0;
    transform:translate(-50%,-50%) scale(0);
  }
  .fab.promo-on .sparkles i{
    animation: spark-burst calc(1.28s * var(--t-scale)) linear var(--sp-delay) both;
  }
  @keyframes spark-burst{
    0%{   opacity:0;
          transform:translate(-50%,-50%) scale(0) rotate(calc(var(--sp-rot) * -1));
          animation-timing-function: cubic-bezier(.15,.85,.3,1); }
    5%{   opacity:1;
          transform:translate(calc(-50% + var(--sp-x) * .34), calc(-50% + var(--sp-y) * .34))
                    scale(.9) rotate(calc(var(--sp-rot) * -.4));
          animation-timing-function: cubic-bezier(.2,.7,.35,1); }
    15%{  opacity:1;
          transform:translate(calc(-50% + var(--sp-x) * 1.06), calc(-50% + var(--sp-y) * 1.06))
                    scale(1.14) rotate(calc(var(--sp-rot) * .35));
          animation-timing-function: cubic-bezier(.4,0,.5,1); }
    26%{  opacity:1;
          transform:translate(calc(-50% + var(--sp-x)), calc(-50% + var(--sp-y)))
                    scale(1) rotate(0deg);
          animation-timing-function: linear; }
    72%{  opacity:1;
          transform:translate(calc(-50% + var(--sp-x) * 1.1), calc(-50% + var(--sp-y) * 1.1))
                    scale(.97) rotate(calc(var(--sp-rot) * .5));
          animation-timing-function: cubic-bezier(.4,0,.7,.6); }
    100%{ opacity:0;
          transform:translate(calc(-50% + var(--sp-x) * 1.32), calc(-50% + var(--sp-y) * 1.32))
                    scale(.4) rotate(var(--sp-rot)); }
  }
  @media (prefers-reduced-motion: reduce){
    .fab.promo-on .sparkles i{ animation:none; opacity:0; }
  }

  /* ================= pill ================= */
  .main-bar{
    position:relative;
    background: var(--white);
    border:1px solid var(--gray-200);
    border-radius:32px;
    height:64px;
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 16px 8px 8px;
    box-shadow: 0 8px 12px rgba(0,0,0,.06);
    transition: background-color .45s ease, border-color .45s ease, box-shadow .45s ease;
  }
  /* over the fill the pill becomes frosted glass, per the design: 80% white
     plus a 6px backdrop blur and a hairline white border. The blur needs the
     translucent background to have something to sample — the fill. */
  .fab.prog .main-bar, .fab.done .main-bar{
    background: rgba(255,255,255,.8);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-color: rgba(255,255,255,.2);
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }

  .checkout-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    height:48px; padding:0 16px; border-radius:24px;
    background: var(--accent); color:#fff;
    font-size:14px; font-weight:600; border:none; cursor:pointer;
    transition: transform .15s ease, background .2s ease;
  }
  .checkout-btn:hover{ background: var(--accent-dark); }
  .checkout-btn:active{ transform: scale(.96); }

  .cart-summary{ display:flex; align-items:center; gap:12px; }
  .cart-price{ display:flex; flex-direction:column; align-items:flex-end; }
  .cart-price .label{ font-size:12px; color:var(--gray-600); line-height:20px; margin-bottom:-2px; }
  .cart-price .amount{ font-size:16px; font-weight:700; color:#000; line-height:28px; }
  /* the toman mark at its natural 13x8 — the size the design reserves for it.
     currentColor rather than the file's baked-in black, so the tone is set in
     one place. */
  .cart-price .amount .toman{
    display:inline-block; width:13px; height:8px;
    margin-inline-start:4px;   /* in RTL, inline-start faces the number */
    color:#000;
  }
  .cart-price .amount .toman svg{ display:block; width:100%; height:100%; }

  .avatars{ display:flex; align-items:center; }
  .avatars .av{
    width:32px; height:32px; border-radius:50%;
    border:2px solid #fff; margin-left:-8px;
    background:#fff center/cover no-repeat;
    box-shadow: 0 1px 2px rgba(0,0,0,.16);
  }
  .avatars .av:first-child{ margin-left:0; }

  /* ================= controls ================= */
  .tools{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:600px; max-width:94vw; margin:30px auto 0 auto;
  }
  .tools-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
  .replay-btn{
    margin:0;
    background:rgba(255,255,255,.08); color:#fff;
    border:1px solid rgba(255,255,255,.18);
    padding:10px 20px; border-radius:999px; font-size:13px; cursor:pointer;
    transition:background .2s ease, opacity .2s ease;
  }
  .replay-btn:hover{ background:rgba(255,255,255,.16); }
  .replay-btn:disabled{ opacity:.35; cursor:default; }
  .sw{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 14px 8px 10px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    color:#cfcbd8; font-size:12.5px; cursor:pointer; user-select:none;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .sw:hover{ background:rgba(255,255,255,.11); }
  .sw input{ position:absolute; opacity:0; pointer-events:none; }
  .sw .dot{
    width:30px; height:18px; border-radius:999px;
    background:rgba(255,255,255,.16); position:relative; flex:none;
    transition:background .22s ease;
  }
  .sw .dot::after{
    content:''; position:absolute; top:3px; left:3px;
    width:12px; height:12px; border-radius:50%; background:#fff;
    transition:transform .22s cubic-bezier(.3,.8,.3,1);
  }
  .sw.on{ color:#fff; border-color:rgba(255,255,255,.3); background:rgba(255,255,255,.13); }
  .sw.on .dot{ background:var(--accent); }
  .sw.on .dot::after{ transform:translateX(12px); }

  .num{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 10px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    color:#cfcbd8; font-size:12.5px;
    transition:opacity .2s ease, border-color .2s ease;
  }
  .num i{ font-style:normal; color:#8b8798; }
  .num input{
    width:46px; background:transparent; border:none; color:#fff;
    font-family:inherit; font-size:13px; text-align:center; padding:2px 0;
    -moz-appearance:textfield;
  }
  .num input::-webkit-outer-spin-button, .num input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .num input:focus{ outline:none; }
  .num:focus-within{ border-color:rgba(255,255,255,.4); }
  .num.off{ opacity:.32; }
  .num.off input{ pointer-events:none; }
</style>
</head>

          </svg>

        </button>

          <div class="cart-price">
            <span class="label">جمع سبد</span>
            <span class="amount" dir="rtl"><span id="cartAmount">۱,۴۵۰,۰۰۰</span><span class="toman" role="img" aria-label="تومان"><svg viewBox="0 0 13 8" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8.59401 1.71429H3.76766V0H8.59401V1.71429ZM12.891 2.67669C12.7976 1.93985 12.6575 1.17293 12.4862 0.360902L10.8048 1.02256C11.0228 1.89474 11.194 2.75188 11.3497 3.57895C11.4431 4.10526 11.521 4.57143 11.5832 5.03759C11.0383 5.23308 10.2443 5.41353 9.18563 5.56391C7.83114 5.7594 6.3988 5.84962 4.90419 5.84962C4.06347 5.84962 3.40958 5.80451 2.92695 5.72932C2.44431 5.6391 2.08623 5.47368 1.82156 5.23308C1.55689 4.99248 1.43234 4.61654 1.43234 4.1203C1.43234 3.57895 1.47904 2.93233 1.54132 2.16541L0.311377 2C0.28024 2.09023 0.264671 2.21053 0.249102 2.3609C0.186826 2.79699 0.124551 3.21805 0.0778443 3.60902C0.0311377 4.01504 0 4.37594 0 4.70677C0 5.95489 0.40479 6.81203 1.1988 7.29323C2.00838 7.7594 3.14491 8 4.62395 8C5.82275 8 6.97485 7.92481 8.06467 7.78947C9.17006 7.65414 10.1353 7.44361 10.9449 7.17293C11.4431 6.99248 11.8323 6.79699 12.1281 6.6015C12.424 6.40601 12.6419 6.15038 12.782 5.83459C12.9222 5.5188 13 5.11278 13 4.58647C13 4.03008 12.9533 3.38346 12.8443 2.66165L12.891 2.67669Z" fill="currentColor"/></svg></span></span>

  /* The design's own 14x14 running icon is hosted on figma.com, which this
     environment cannot reach, so the gift mark from the same set stands in.
     Swap GIFT_ICON if you want the exact one. */
  const GIFT_ICON = `<svg class="prog-icon" width="15" height="16" viewBox="0 0 15 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M1.14801 14.0947C1.14801 15.3268 1.8873 16 3.11946 16H6.78588V9.05182H1.14801V14.0947ZM7.97597 16H11.6424C12.8745 16 13.6138 15.3268 13.6138 14.0947V9.05182H7.97597V16ZM0 7.13449C0 7.92187 0.450789 8.2765 1.24417 8.2765H6.78588V4.1713H5.66791C4.3997 4.1713 3.63636 3.41398 3.63636 2.50038C3.63636 1.67092 4.23742 1.17806 5.07888 1.17806C6.04658 1.17806 6.78588 1.92337 6.78588 3.11946V4.1713H7.97597V3.11946C7.97597 1.92337 8.71528 1.17806 9.68293 1.17806C10.5244 1.17806 11.1255 1.67092 11.1255 2.50038C11.1255 3.41398 10.3621 4.1713 9.09392 4.1713H7.97597V8.2765H13.5177C14.317 8.2765 14.7618 7.92187 14.7618 7.13449V5.3133C14.7618 4.51991 14.317 4.1713 13.5177 4.1713H11.5282C12.021 3.75658 12.3156 3.16153 12.3156 2.44628C12.3156 1.00976 11.1916 0 9.74306 0C8.64314 0 7.75956 0.613073 7.38092 1.67092C7.00228 0.613073 6.11871 0 5.01878 0C3.57025 0 2.44628 1.00976 2.44628 2.44628C2.44628 3.16153 2.74079 3.75658 3.23366 4.1713H1.24417C0.480841 4.1713 0 4.51991 0 5.3133V7.13449Z" fill="url(#paint0_linear_448_11135)"/>
<defs>
<linearGradient id="paint0_linear_448_11135" x1="0" y1="0" x2="14.7618" y2="16" gradientUnits="userSpaceOnUse">
<stop stop-color="#5DBB81"/>
<stop offset="1" stop-color="#007F46"/>
</linearGradient>
</defs></svg>`;

  /* Success check — authored, a generic UI glyph rather than brand artwork:
     a green disc with the tick knocked out in white, 16x16 per the design. */
  const CHECK_ICON = `<svg class="prog-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="8" cy="8" r="8" fill="var(--done-green)"/>
      <path d="M4.5 8.35 6.85 10.6 11.5 5.9" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

  /* ======================= configuration ======================= */
  const TARGET = 4000000;          // the goal the percentage runs against
  const GOAL   = 'تخفیف ۲۰٪';
  const DONE_TEXT  = 'تبریک! تخفیف ۲۰٪ فعال شد.';
  const PROMO_TEXT = 'تخفیف ویژه امروز فقط برای شما فعال شد.';

  const TIME_SCALE = 1.1;
  const BASE = {
    SPEED_MS_PER_PX: 1.82,   // crest advance: constant SPATIAL speed
    CH_DUR_MS:       480,    // one letter's full pulse incl. undershoot
    LEAD_IN_MS:      200,
    TAG_SWING_MS:   1000,
  };
  const WAVE = {
    SPEED_MS_PER_PX: BASE.SPEED_MS_PER_PX * TIME_SCALE,
    CH_DUR_MS:       BASE.CH_DUR_MS       * TIME_SCALE,
    LEAD_IN_MS:      BASE.LEAD_IN_MS      * TIME_SCALE,
  };
  document.documentElement.style.setProperty('--t-scale', TIME_SCALE);

  const HOLD_MS  = 3000;   // promo dwell, and how long completion is held
  const CLOSE_MS = (() => {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--expand-dur').trim();
    const ms = v.endsWith('ms') ? parseFloat(v) : parseFloat(v) * 1000;
    return (ms || 550) + 70;
  })();

  const fa = n => n.toLocaleString('en-US').replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ======================= elements ======================= */
  const fab      = document.getElementById('fab');
  const fillBar  = document.getElementById('fillBar');
  const rowWave  = document.getElementById('rowWave');
  const rowProg  = document.getElementById('rowProg');
  const progText = document.getElementById('progText');
  const progIcon = document.getElementById('progIcon');
  const waveText = document.getElementById('waveText');
  const waveSrc  = document.getElementById('waveSrc');
  const waveGlyphs = document.getElementById('waveGlyphs');
  const waveIcon = document.getElementById('waveIcon');
  const tagWrap  = document.getElementById('tagWrap');
  const tagBadge = document.getElementById('tagBadge');
  const sparkles = document.getElementById('sparkles');
  const sparkEl  = document.getElementById('spark');
  const cartAmount = document.getElementById('cartAmount');
  const replay   = document.getElementById('replay');
  const swPromo  = document.getElementById('swPromo');
  const swProg   = document.getElementById('swProg');
  const numPct   = document.getElementById('numPct');
  const pctInput = numPct.querySelector('input');

  /* ======================= per-letter glyph layer ======================= */
  const ZWJ = '‍';
  /* Arabic-script letters that do NOT connect to the letter AFTER them. Getting
     this set right is what keeps the sentence readable once every glyph lives
     in its own element. */
  const NO_FORWARD_JOIN = new Set([...'اآأإدذرزژوؤةى']);
  const isArabicLetter = c => /[ؠ-ۓ]/.test(c);

  /* Build the canvas font string from computed LONGHANDS. Reading the `font`
     shorthand looks tidier but returns "" whenever it is not serialisable —
     which it is not here, because font-variation-settings is set — and canvas
     then silently keeps its 10px default, yielding a wrong ascent and a
     transform-origin a couple of percent off the real baseline. */
  function measureAscent(el){
    try{
      const cs = getComputedStyle(el);
      const cx = document.createElement('canvas').getContext('2d');
      cx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const m = cx.measureText('ف');
      return m.fontBoundingBoxAscent || m.actualBoundingBoxAscent || 0;
    }catch(e){ return 0; }
  }

  /* The sentence is measured while still INTACT (one shaped run), so every
     glyph's position comes from real Arabic shaping and kerning. Each letter is
     then re-emitted as an absolutely-positioned span parked on its measured
     rect, padded with ZWJ so it keeps the contextual form (initial / medial /
     final) it had inside the run. Splitting without the ZWJs renders every
     letter in isolated form — legible, but the joins visibly break apart. */
  function buildGlyphs(){
    waveGlyphs.textContent = '';
    const textNode = waveSrc.firstChild;
    if (!textNode) return [];
    const s = textNode.nodeValue;
    const base = waveText.getBoundingClientRect();
    const chars = [...s];
    const out = [];
    let contentH = 0, off = 0;

    for (let i = 0; i < chars.length; i++){
      const c = chars[i], len = c.length;
      if (c.trim() !== ''){
        const r = document.createRange();
        r.setStart(textNode, off); r.setEnd(textNode, off + len);
        const rect = r.getBoundingClientRect();
        if (!contentH) contentH = rect.height;

        const span = document.createElement('span');
        span.className = 'ch';
        let content = c;
        if (isArabicLetter(c)){
          const prev = chars[i-1], next = chars[i+1];
          if (prev && isArabicLetter(prev) && !NO_FORWARD_JOIN.has(prev)) content = ZWJ + content;
          if (next && isArabicLetter(next) && !NO_FORWARD_JOIN.has(c))    content = content + ZWJ;
        }
        span.textContent = content;
        const tx = rect.left - base.left, ty = rect.top - base.top;
        span.style.left = tx + 'px';
        span.style.top  = ty + 'px';
        out.push({ span, tx, ty, centre: tx + rect.width / 2 });
        waveGlyphs.appendChild(span);
      }
      off += len;
    }

    /* Align the glyph layer to the intact run. A Range rect reports the font's
       CONTENT box, but the span lays its own text out inside a full LINE box and
       re-applies the half-leading — so parking a span at the rect's top renders
       the glyph exactly one half-leading too low. Comparing box tops cannot
       detect this (both are equal); the leading has to be subtracted. Measured,
       not hard-coded, so a different font or line-height still lands right. */
    if (out.length){
      const lineBox = out[0].span.getBoundingClientRect().height;
      const halfLeading = (lineBox - contentH) / 2;
      const ascent = measureAscent(waveText);
      if (ascent && lineBox){
        waveGlyphs.style.setProperty('--ch-origin-y',
          ((halfLeading + ascent) / lineBox * 100).toFixed(2) + '%');
      }
      if (halfLeading) for (const g of out) g.span.style.top = (g.ty - halfLeading) + 'px';
    }
    return out;
  }

  /* Delay comes from each glyph's x position, NOT its index, so the crest moves
     at a constant speed in space. Persian reads right-to-left, so the wave
     starts at the rightmost glyph and travels left. */
  function scheduleWave(glyphs){
    if (!glyphs.length) return;
    const originX = Math.max(...glyphs.map(g => g.centre));
    for (const g of glyphs){
      const d = Math.abs(originX - g.centre) * WAVE.SPEED_MS_PER_PX;
      g.span.style.setProperty('--ch-delay', (WAVE.LEAD_IN_MS + d) + 'ms');
      g.span.style.setProperty('--ch-dur',   WAVE.CH_DUR_MS + 'ms');
    }
  }

  /* Load a sentence and (re)run the crest over it. Used by promo AND by the
     completion banner — the animation is not tied to either. */
  function runWaveText(text){
    fab.classList.remove('wave-on');
    waveSrc.textContent = text;
    waveGlyphs.textContent = '';
    void fab.offsetWidth;                 // flush so the run restarts clean
    scheduleWave(buildGlyphs());
    requestAnimationFrame(() => fab.classList.add('wave-on'));
  }

  /* ======================= sparkles ======================= */
  const STAR = (c,o) => `<svg viewBox="0 0 24 24" fill="${c}" opacity="${o}"><path d="M12 0c1 7 4 11 12 12-8 1-11 5-12 12-1-7-4-11-12-12C8 11 11 7 12 0Z"/></svg>`;
  const DOT  = (c,o) => `<svg viewBox="0 0 24 24" fill="${c}" opacity="${o}"><circle cx="12" cy="12" r="12"/></svg>`;
  const A='#E1522C', A_SOFT='#F09A80', A_PALE='#F8CDC0', COOL='#A9B6E8', COOL_PALE='#C9D2F2';
  const SPARKS = [
    // destX, destY (px from the tag centre — where it FLIES TO), size, delay, spin, shape
    [-19,-13, 11,   0,  38, STAR(COOL_PALE,.95)],
    [ -6,-19,  6,  40,  22, DOT (COOL,.85)     ],
    [-27,  2,  7,  25, -30, DOT (A_SOFT,.9)    ],
    [-22, 13,  9,  55, -44, STAR(A,.85)        ],
    [ -9, 20,  8,  70,  34, STAR(A_PALE,.95)   ],
    [ 20,-11,  7,  15, -26, STAR(A,.9)         ],
    [ 26,  6, 10,  60,  46, STAR(A_SOFT,.9)    ],
    [ 12, 19,  5,  85, -18, DOT (COOL,.7)      ],
    [-14, -4,  3,  35,  28, DOT (A,.8)         ],
    [ 15,-21,  4,  50, -36, DOT (COOL_PALE,.9) ],
  ];
  function buildSparkles(){
    sparkles.textContent = '';
    for (const [x,y,size,delay,rot,svg] of SPARKS){
      const i = document.createElement('i');
      // no left/top offset on purpose — they all start at the tag centre
      i.style.width = size+'px'; i.style.height = size+'px';
      i.style.setProperty('--sp-delay', (delay * TIME_SCALE)+'ms');
      i.style.setProperty('--sp-x', x+'px');
      i.style.setProperty('--sp-y', y+'px');
      i.style.setProperty('--sp-rot', rot+'deg');
      i.innerHTML = svg;
      sparkles.appendChild(i);
    }
  }

  /* ======================= celebration burst ======================= */
  /* built once and rewound per play — reloading would re-parse 128KB of JSON
     and rebuild the whole SVG tree every time */
  let sparkAnim = null;
  function playSpark(){
    if (reduced) return;
    if (!sparkAnim){
      sparkAnim = lottie.loadAnimation({
        container: sparkEl, renderer:'svg', loop:false, autoplay:false,
        animationData: CELEBRATION,
      });
      sparkAnim.addEventListener('complete', () => sparkEl.classList.remove('on'));
    }
    sparkEl.classList.add('on');
    sparkAnim.goToAndPlay(0, true);
  }

  /* ======================= state ======================= */
  const state = { promo:false, prog:false, pct:65, done:false };
  let holdTimer, pending;

  function showRow(which){
    rowWave.classList.toggle('active', which === 'wave');
    rowProg.classList.toggle('active', which === 'prog');
  }

  function renderRunning(){
    const cart = Math.round(TARGET * state.pct / 100);
    cartAmount.textContent = fa(cart);
    const left = Math.max(0, TARGET - cart);
    /* One uniform weight, no bold runs: the design sets both rows as a single
       Medium (600) run, and mixing 600 with <b>'s 700 was the inconsistency. */
    progText.textContent = `${fa(left)} تومان تا ${GOAL} باقی مانده! 🛵`;
    progIcon.innerHTML = GIFT_ICON;
    fillBar.style.setProperty('--fill-w', state.pct + '%');
  }

  /* ======================= flows ======================= */
  function playPromo(){
    clearTimeout(holdTimer);
    showRow('wave');
    tagWrap.classList.remove('hide');
    waveIcon.innerHTML = '';
    tagBadge.innerHTML = '';
    sparkles.textContent = '';
    void fab.offsetWidth;
    // a fresh node restarts the tag's own keyframes; its baked-in duration is
    // rewritten so the swing keeps pace with the retimed wave
    tagBadge.innerHTML = TAG_SVG.replace(/1000ms/g, Math.round(BASE.TAG_SWING_MS * TIME_SCALE)+'ms');
    buildSparkles();
    fab.classList.add('open','promo-on');
    runWaveText(PROMO_TEXT);
    holdTimer = setTimeout(() => {
      fab.classList.remove('promo-on','wave-on','open');
    }, HOLD_MS);
  }

  /* Completion: the card grows 8px taller, the fill covers the whole width, the
     banner swaps in — and the promo's per-letter crest runs over that new
     sentence — with the burst playing from behind. */
  function celebrate(){
    clearTimeout(holdTimer); clearTimeout(pending);
    state.done = true;
    fab.classList.remove('promo-on');
    fab.classList.add('open','prog','done');
    showRow('wave');
    tagWrap.classList.add('hide');
    waveIcon.innerHTML = CHECK_ICON;
    fillBar.style.setProperty('--fill-w', '100%');
    cartAmount.textContent = fa(TARGET);
    runWaveText(DONE_TEXT);
    playSpark();
    holdTimer = setTimeout(resetToDefault, HOLD_MS);
  }

  // back to the plain FAB with every toggle cleared
  function resetToDefault(){
    state.done = false; state.promo = false; state.prog = false;
    fab.classList.remove('done','wave-on','promo-on');
    sync(); apply();
  }

  function maybeComplete(){
    if (state.done) return false;
    if (state.prog && state.pct >= 100){ celebrate(); return true; }
    return false;
  }

  function apply(opts){
    clearTimeout(pending); clearTimeout(holdTimer);
    state.done = false;
    fab.classList.remove('done','promo-on','wave-on');
    fab.classList.toggle('prog', state.prog);

    if (state.prog){
      fab.classList.add('open');
      showRow('prog');
      renderRunning();
      maybeComplete();
    } else if (state.promo){
      renderRunning();                       // keeps the pill total consistent
      /* the card must actually close and render as closed before re-opening,
         or the browser coalesces both class changes into one style pass, sees
         no net height change, and never re-runs the open transition */
      if (fab.classList.contains('open') && opts && opts.restart){
        fab.classList.remove('open');
        pending = setTimeout(playPromo, CLOSE_MS);
      } else {
        playPromo();
      }
    } else {
      showRow(null);
      fab.classList.remove('open');
      cartAmount.textContent = fa(Math.round(TARGET * state.pct / 100));
    }
    replay.disabled = (!state.promo && !state.prog);
  }

  /* ======================= controls ======================= */
  function sync(){
    swPromo.classList.toggle('on', state.promo);
    swProg .classList.toggle('on', state.prog);
    swPromo.querySelector('input').checked = state.promo;
    swProg .querySelector('input').checked = state.prog;
    numPct.classList.toggle('off', !state.prog);
    pctInput.value = state.pct;
  }

  /* Promo and progress both own the card's top row, so they cannot coexist:
     turning either on switches the other off. Enforced here, where state
     changes, so no combination can slip through. */
  swPromo.querySelector('input').addEventListener('change', e => {
    state.promo = e.target.checked;
    if (state.promo) state.prog = false;
    sync(); apply({restart:true});
  });
  swProg.querySelector('input').addEventListener('change', e => {
    state.prog = e.target.checked;
    if (state.prog) state.promo = false;
    sync(); apply({restart:true});
  });

  /* Validation only ever clamps the range — it must not rewrite the field mid
     edit, or typing "100" is read as "1" first and snapped, and the following
     characters land on the snapped number. */
  const commit = () => {
    const raw = pctInput.value.trim();
    if (raw === '') return;
    let v = Math.round(+raw);
    if (!isFinite(v)) return;
    v = Math.max(0, Math.min(100, v));
    state.pct = v;
    if (state.prog){
      renderRunning();
      maybeComplete();
    } else {
      cartAmount.textContent = fa(Math.round(TARGET * v / 100));
    }
  };
  pctInput.addEventListener('input', commit);
  pctInput.addEventListener('blur', () => { pctInput.value = state.pct; });

  replay.addEventListener('click', () => apply({restart:true}));

  // wait for the webfont before measuring — glyph rects taken against a
  // fallback face would park every letter at the wrong x
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    state.promo = true; sync();
    setTimeout(() => apply({}), 500);
  });
</script>

</body>
</html>
